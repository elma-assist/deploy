name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag; leave empty to deploy the latest release
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bootstrap/elma-deploy-latest scripts/deploy.sh scripts/backup.sh
      - name: Validate Compose
        run: |
          set -euo pipefail
          IMAGE_TAG=$(sed -n 's/^IMAGE_TAG=//p' release.env)
          test -n "$IMAGE_TAG"
          validation_dir=$(mktemp -d)
          cp runtime.env.example "$validation_dir/runtime.env"
          ELMA_SHARED_DIR="$validation_dir" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file runtime.env.example -f compose.yaml config --quiet

  deploy:
    needs: validate
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://elma-assist.de
    steps:
      - name: Configure deployment SSH key and pinned host identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          ssh -o BatchMode=yes "deploy@$DEPLOY_HOST" \
            "/usr/local/sbin/elma-deploy-latest '$RELEASE_VERSION'"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
